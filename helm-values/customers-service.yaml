image:
  name: customers-service
  tag: "v1.0.0"

service:
  port: 8081

component: service

replicaCount: 1

configMap:
  data:
    SPRING_PROFILES_ACTIVE: "docker,mysql"
    CONFIG_SERVER_URL: "http://config-server:8888"
    # SPRING_DATASOURCE_URL is injected as an ArgoCD Helm parameter per environment.
    # After terraform apply, run: terraform -chdir=terraform/environments/dev output -raw rds_connection_string
    # Then update the Application CRD parameter in k8s/argocd/applications/{env}/customers-service.yaml.

env:
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: rds-credentials
        key: username
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: rds-credentials
        key: password

initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done']
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
  - name: wait-for-discovery-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done']
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1
