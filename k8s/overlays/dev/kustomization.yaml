apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev overlay: 1 replica per service, petclinic-dev namespace, HPA enabled
namespace: petclinic-dev

resources:
  - ../../base/config-server
  - ../../base/discovery-server
  - ../../base/api-gateway
  - ../../base/customers-service
  - ../../base/visits-service
  - ../../base/vets-service
  - ../../base/genai-service
  - ../../base/admin-server
  - hpa-api-gateway.yaml
  - hpa-customers-service.yaml
  - hpa-visits-service.yaml
  - hpa-vets-service.yaml
  - hpa-genai-service.yaml
