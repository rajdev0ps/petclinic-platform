apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  labels:
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
  # The IRSA role ARN annotation is NOT set here — it is injected at install time
  # by scripts/install-eso.sh using the Terraform output `eso_role_arn`.
  # Run: bash scripts/install-eso.sh ENV=dev
  annotations: {}
