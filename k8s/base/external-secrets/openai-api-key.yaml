apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openai-api-key
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: openai-api-key
    creationPolicy: Owner
  data:
    # remoteRef.key is environment-specific (petclinic/{env}/openai-api-key).
    # Prod deployments must patch this via a Kustomize overlay or separate manifest.
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: petclinic/dev/openai-api-key
