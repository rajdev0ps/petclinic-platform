# =============================================================================
# Karpenter Installation — PETPLAT-73
# =============================================================================
# This file documents the Karpenter Helm install command.
# It is NOT applied with kubectl — run the shell command below instead.
#
# Prerequisites:
#   1. terraform apply completed in terraform/environments/dev/
#   2. kubectl context points to petclinic-dev cluster
#   3. Logged into ECR public: aws ecr-public get-login-password --region us-east-1 | \
#        docker login --username AWS --password-stdin public.ecr.aws
#
# Run from: terraform/environments/dev/
# ---------------------------------------------------------------------------
#
# helm upgrade --install karpenter oci://public.ecr.aws/karpenter/karpenter \
#   --version 1.0.0 \
#   --namespace kube-system \
#   --set settings.clusterName=$(terraform output -raw eks_cluster_name) \
#   --set settings.interruptionQueue=$(terraform output -raw karpenter_queue_name) \
#   --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=$(terraform output -raw karpenter_role_arn)" \
#   --create-namespace \
#   --wait
#
# Verify install:
#   kubectl get pods -n kube-system -l app.kubernetes.io/name=karpenter
#   kubectl logs -n kube-system -l app.kubernetes.io/name=karpenter --tail=50
#
# After install, apply the NodePool and EC2NodeClass:
#   kubectl apply -f k8s/base/karpenter/nodepool.yaml
# =============================================================================
