apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-server-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "PLATFORM_REPO_URL"
    targetRevision: main
    path: helm/petclinic-service
    helm:
      releaseName: admin-server
      valueFiles:
        - ../../helm-values/admin-server.yaml
        - ../../helm-values/prod.yaml
      parameters:
        - name: image.registry
          value: "ECR_REGISTRY_PROD"
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
