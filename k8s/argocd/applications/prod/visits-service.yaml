apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: visits-service-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "PLATFORM_REPO_URL"
    targetRevision: main
    path: helm/petclinic-service
    helm:
      releaseName: visits-service
      valueFiles:
        - ../../helm-values/visits-service.yaml
        - ../../helm-values/prod.yaml
      parameters:
        - name: image.registry
          value: "ECR_REGISTRY_PROD"
        - name: configMap.data.SPRING_DATASOURCE_URL
          value: "RDS_JDBC_URL_PROD"
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
