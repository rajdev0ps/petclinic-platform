apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: discovery-server-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/rajdev0ps/petclinic-platform.git"
    targetRevision: main
    path: helm/petclinic-service
    helm:
      releaseName: discovery-server
      valueFiles:
        - ../../helm-values/discovery-server.yaml
        - ../../helm-values/dev.yaml
      parameters:
        - name: image.registry
          value: "995679261046.dkr.ecr.us-east-1.amazonaws.com/petclinic-dev"
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
