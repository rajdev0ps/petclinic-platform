apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.default: role:readonly
  policy.csv: |
    # Admin role: full access to all applications and settings
    # exec is intentionally excluded — use kubectl exec directly for better audit trail
    p, role:admin, applications, *, */*, allow
    p, role:admin, clusters, get, *, allow
    p, role:admin, repositories, *, *, allow
    p, role:admin, logs, get, */*, allow

    # Superadmin role: adds exec capability for break-glass scenarios only
    # Assign sparingly — exec bypasses readOnlyRootFilesystem mitigations
    p, role:superadmin, applications, *, */*, allow
    p, role:superadmin, clusters, get, *, allow
    p, role:superadmin, repositories, *, *, allow
    p, role:superadmin, logs, get, */*, allow
    p, role:superadmin, exec, create, */*, allow

    # Developer role: view all apps, sync dev environment only (no prod sync)
    p, role:developer, applications, get, */*, allow
    p, role:developer, applications, sync, */config-server-dev, allow
    p, role:developer, applications, sync, */discovery-server-dev, allow
    p, role:developer, applications, sync, */api-gateway-dev, allow
    p, role:developer, applications, sync, */customers-service-dev, allow
    p, role:developer, applications, sync, */visits-service-dev, allow
    p, role:developer, applications, sync, */vets-service-dev, allow
    p, role:developer, applications, sync, */genai-service-dev, allow
    p, role:developer, applications, sync, */admin-server-dev, allow

    # Group assignments — add specific user to role:superadmin only when exec is needed
    g, admin, role:admin
